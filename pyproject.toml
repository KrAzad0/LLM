[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaychat"
version = "0.1.0"
description = "An approachable instant messaging engine with a CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kumar Azad"}]
dependencies = []

[project.scripts]
relaychat = "instamsg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
