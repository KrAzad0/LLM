[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcalc"
version = "0.1.0"
description = "A smart scientific calculator with a safe expression evaluator and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kumar Azad"}]
dependencies = []

[project.scripts]
smartcalc = "smartcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
